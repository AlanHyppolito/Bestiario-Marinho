<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=\, initial-scale=1.0">
    <title>Document</title>
    <script src="./js/sessao.js"></script>
    <link rel="stylesheet" href="./CSS/pesquisa.css">

</head>

<body>
    <div class="header">
        <div class="logo">
            <a href="index.html">
                <img class="img-logo" src="assets/IMG/Logo.png" alt="Polvo segurando uma bussola">
            </a>
        </div>
        <div class="ata">
            <div class="atalhos"><a href="pesquisa.html">Pesquisar</a></div>
            <div class="atalhos"><a href="dashboard.html">Dashboard</a></div>
            <div class="atalhos"><a href="historico.html">Historico</a></div>
        </div>
        <div class="exit"><a onclick="limparSessao()">Sair</a></div>
    </div>
    <div class="card-fundo-pesquisa">
        <div class="fundo-pesquisa">
            <div class="card-pesquisa">
                <div class="pesquisa">
                    <input type="text" id="ipt_pesquisa" list="lista-criaturas" placeholder="Pesquisa" oninput="exibirTexto()">
                    <datalist id="lista-criaturas">
                        <option value="Kraken">Kraken</option>
                        <option value="Jörmungandr">Jörmungandr</option>
                        <option value="Sereia">Sereia</option>
                        <option value="Cila">Cila</option>
                        <option value="Ryūjin">Ryūjin</option>
                        <option value="Leviatã">Leviatã</option>
                        <option value="Aspidochelone">Aspidochelone</option>
                        <option value="Cthulhu">Cthulhu</option>
                        <option value="Godzilla">Godzilla</option>
                        <option value="Megalodon">Megalodon</option>
                        <option value="Kappa">Kappa</option>
                        <option value="Hipocampo">Hipocampo</option>
                        <option value="Tiamat">Tiamat</option>
                        <option value="Hydra">Hydra</option>
                        <option value="Apep">Apep</option>
                        <option value="Charybdis">Charybdis</option>
                        <option value="Umibōzu">Umibōzu</option>
                        <option value="Akkorokamui">Akkorokamui</option>
                        <option value="Kelpie">Kelpie</option>
                        <option value="Makara">Makara</option>
                        <option value="Cetus">Cetus</option>
                        <option value="Nammu">Nammu</option>
                        <option value="Zaratan">Zaratan</option>
                    </datalist>
                </div>
                <div class="resp">
                    <div class="inicio">
                        <div class="img" id="img"></div>
                        <div class="info">
                            <div class="nomeB" id="nomeB"></div>
                            <div class="classe" id="classe"></div>
                            <div class="origem" id="origem"></div>
                        </div>
                    </div>
                    <div class="texto" id="texto"></div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
<script src="./js/informacoes.js"></script>
<script>

    let besta = "";

function exibirTexto() {
    
    besta = document.getElementById("ipt_pesquisa").value;

    if (bestaMap[besta]) {
        console.log(`Besta selecionada: ${besta}`);

        img.innerHTML = `<img class="img" src="${bestaMap[besta].img}" alt="${besta}">`;
        nomeB.innerHTML = `<b>Nome:</b> ${besta}`;
        classe.innerHTML = `<b>Classe:</b> ${bestaMap[besta].classe}`;
        origem.innerHTML = `<b>Origem:</b> ${bestaMap[besta].origem}`;
        texto.innerHTML = `${bestaMap[besta].sobre}`;

    } else {

        img.innerHTML = "";
        nomeB.innerHTML = "";
        classe.innerHTML = "";
        origem.innerHTML = "";
        texto.innerHTML = "";
    }
}
</script>
