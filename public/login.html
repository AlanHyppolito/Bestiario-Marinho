<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="CSS/login.css">
</head>

<body>
    <div class="card">
        <div class="titulo">
            <h2>Login</h2>
        </div>
        <div class="input">
            <div class="insert-email">
                <div>
                    <img class="ancora" src="assets/IMG/Ancora.png" alt="">
                </div>
                <input type="text" id="ipt_email" required oninput="">
                <label for="ipt_email">Insira seu email</label>
            </div>

            <div class="insert-senha">
                <div>
                    <img class="chave" src="assets/IMG/Chave.png" alt="Chave">
                </div>
                <div>
                    <input type="text" id="ipt_senha" required oninput="">
                    <label for="ipt_senha">Insira sua senha</label>
                </div>
            </div>
        </div>
        <button onclick="entrar()" class="botao">Entrar</button>
        <div class="link">
            <span>Novo Usuário? <a href="cadastro.html">Clique aqui!</a></span>
        </div>
    </div>
</body>

</html>
<script>
    function entrar() {

        var emailVar = ipt_email.value;
        var senhaVar = ipt_senha.value;

        if (emailVar == "" || senhaVar == "") {
            cardErro.style.display = "block"
            mensagem_erro.innerHTML = "(Mensagem de erro para todos os campos em branco)";
            return false;
        }

        console.log("FORM LOGIN: ", emailVar);
        console.log("FORM SENHA: ", senhaVar);

        fetch("/usuarios/autenticar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                emailServer: emailVar,
                senhaServer: senhaVar
            })
        }).then(function (resposta) {
            console.log("ESTOU NO THEN DO entrar()!")

            if (resposta.ok) {
                console.log(resposta);

                resposta.json().then(json => {
                    console.log(json);
                    console.log(JSON.stringify(json));
                    sessionStorage.EMAIL_USUARIO = json.email;
                    sessionStorage.NOME_USUARIO = json.nome;
                    sessionStorage.ID_USUARIO = json.id;
                    console.log(aqui)
                    setTimeout(function () {
                        window.location = "dashboard.html";
                    }, 1000); // apenas para exibir o loading

                });

            } else {

                console.log("Houve um erro ao tentar realizar o login!");

                resposta.text().then(texto => {
                    console.error(texto);
                });
            }

        })
        return false;
    }
</script>
