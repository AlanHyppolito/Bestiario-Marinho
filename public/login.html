<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="/public/CSS/login.css">
</head>

<body>
    <div class="card">
        <div class="titulo">
            <h2>Login</h2>
        </div>
        <div class="input">
            <div class="insert-email">
                <div>
                    <img class="ancora" src="..\IMG\Ancora.png" alt="">
                </div>
                <input type="text" id="ipt_email" required oninput="">
                <label for="ipt_email">Insira seu email</label>
            </div>

            <div class="insert-senha">
                <div>
                    <img class="chave" src="../IMG/Chave.png" alt="Chave">
                </div>
                <div>
                    <input type="text" id="ipt_senha" required oninput="">
                    <label for="ipt_senha">Insira sua senha</label>
                </div>
            </div>
        </div>
        <button class="botao">Entrar</button>
        <div class="link">
            <span>Novo Usuário? <a href="cadastro.html">Clique aqui!</a></span>
        </div>
    </div>
</body>

</html>
<script src="/src/controllers/login.js"></script>
