<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="CSS/historico.css">
    <script src="./js/sessao.js"></script>
    <!-- scripts do Chart.js - 2022-1 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body onload="obterDadosHistorico()">

    <div class="header">
        <div class="logo">
            <a href="index.html">
                <img class="img-logo" src="assets/IMG/Logo.png" alt="Polvo segurando uma bussola">
            </a>
        </div>
        <div class="ata">
            <div class="atalhos"><a href="pesquisa.html">Pesquisar</a></div>
            <div class="atalhos"><a href="dashboard.html">Dashboard</a></div>
            <div class="atalhos"><a href="historico.html">Historico</a></div>
        </div>
        <div class="exit"><a onclick="limparSessao()">Sair</a></div>
    </div>
    <div class="teste">
        <div class="card-historico">
            <div class="historico">
                <div class="historico-select">
                    <p class="titulo">Historico</p>
                    <select class="select" name="periodo" id="sel_periodo" onchange="obterDadosHistorico()">
                        <option value="7 day">7 dias</option>
                        <option value="1 month">1 mês</option>
                        <option value="3 month">3 mêses</option>
                        <option value="6 month">6 mêses</option>
                    </select>
                </div>
                <div class="exibirHistorico">
                    <div class="data" id="data"></div>
                    <div class="hora" id="hora"></div>
                    <div class="besta" id="nome"></div>
                </div>
            </div>
        </div>
    </div>
</body>
<script>
    var Id_user = sessionStorage.ID_USUARIO

    function obterDadosHistorico() {
    data.innerHTML = ``;
    hora.innerHTML = ``;
    nome.innerHTML = ``;

    var intervaloTempo = document.getElementById("sel_periodo").value; 

    fetch(`/buscar/${Id_user}/${intervaloTempo}`).then(function (response) {
        if (response.ok) {
            response.text().then(function (texto) {
                if (!texto || texto === "[]") {
                    console.log("Nenhum dado encontrado no histórico para este período.");
                    data.innerHTML = "Sem registros.";
                    return;
                }

                var resposta = JSON.parse(texto);
                console.log(`Dados recebidos: ${JSON.stringify(resposta)}`);
                mostrarHistorico(resposta);
            });
        } else {
            console.error('Erro na resposta da API');
        }
    })
    .catch(function (error) {
        console.error(`Erro na obtenção dos dados: ${error.message}`);
    });
}

    function mostrarHistorico(resposta) {

        for (let i = 0; i < resposta.length; i++) {

            var indiceH = resposta[i];


            data.innerHTML += `${indiceH.data} <br>`
            hora.innerHTML += `${indiceH.hora} <br>`
            nome.innerHTML += `${indiceH.nome} <br>`
        }
    }


</script>
