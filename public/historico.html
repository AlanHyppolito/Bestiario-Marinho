<!DOCTYPE html>
<html lang="en">

<head>

    <link rel="stylesheet" href="CSS/historico.css">
    <script src="./js/sessao.js"></script>
    <!-- scripts do Chart.js - 2022-1 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body onload="obterDadosHistorico()">

    <div class="header">
        <div class="logo">
            <a href="index.html">
                <img class="img-logo" src="assets/IMG/Logo.png" alt="Polvo segurando uma bussola">
            </a>
        </div>
        <div class="ata">
            <div class="atalhos"><a href="pesquisa.html">Pesquisar</a></div>
            <div class="atalhos"><a href="dashboard.html">Dashboard</a></div>
            <div class="atalhos"><a href="historico.html">Historico</a></div>
        </div>
        <div class="exit"><a onclick="limparSessao()">Sair</a></div>
    </div>
    <div class="teste">
        <div class="card-historico">
            <div class="historico">
                <div class="historico-select">
                    <p class="titulo">Historico</p>
                    <select class="select" name="periodo" id="sel_periodo" onchange="obterDadosHistorico()">
                        <option value="7 day">7 dias</option>
                        <option value="1 month">1 mês</option>
                        <option value="3 month">3 mêses</option>
                        <option value="6 month">6 mêses</option>
                    </select>
                </div>
                <div class="exibirHistorico">
                    <div class="data"></div>
                    <div class="hora"></div>
                    <div class="besta"></div>
                </div>
            </div>
        </div>
    </div>
</body>
<script>
    function obterDadosHistorico() {
        var intervaloTempo = document.getElementById("sel_periodo");

        fetch(`/aquarios`).then(function (response) {
            if (response.ok) {
                response.json().then(function (resposta) {
                    console.log(`Dados recebidos: ${JSON.stringify(resposta)}`);
                    resposta;

                    plotarGrafico(resposta);

                });
            } else {
                console.error('Nenhum dado encontrado ou erro na API');
            }
        })
            .catch(function (error) {
                console.error(`Erro na obtenção dos dados p/ gráfico: ${error.message}`);
            });
    }
</script>
