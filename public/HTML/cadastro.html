<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="/public/CSS/cadastro.css">
</head>

<body>
    <div class="card">
        <div class="titulo">
            <h2>Cadastro</h2>
        </div>
        <div class="input">
            <div class="insert-nome">
                <div class="ajuste">
                <div>
                    <img class="imagem" src="../IMG/Chapel.png" alt="">
                </div>
                <div>
                    <input type="text" id="ipt_nome" required oninput="Nome()">
                    <label for="ipt_nome">Insira seu nome completo</label>
                    </div>
                </div>
                <div class="span">
                    <span id="spn_nome"></span>
                </div>
            </div>
            <div class="insert-email">
                <div class="ajuste">
                <div>
                    <img class="imagem" src="../IMG/Ancora.png" alt="">
                </div>
                <div>
                    <input type="text" id="ipt_email" required oninput="Email()">
                    <label for="">Insira seu email</label>
                    </div>
                </div>
                <div class="span">
                    <span id="spn_email"></span>
                </div>
            </div>
            <div class="insert-senha">
                <div class="ajuste">
                <div>
                    <img class="imagem" src="../IMG/Chave.png" alt="">
                </div>
                <div>
                    <input type="text" id="ipt_senha" required oninput="Senha()">
                    <label for="">Insira sua senha desejada</label>
                    </div>
                </div>
                <div class="span">
                    <span id="spn_senha"></span>
                </div>
            </div>
            <div class="insert-senha-confirmacao">
                <div class="ajuste">
                    <div>
                        <img class="imagem" src="../IMG/Chave.png" alt="">
                    </div>
                    <div>
                        <input type="text" id="ipt_confirmacaoSenha" required oninput="validação_senha()">
                        <label for="">Insira sua senha novamente</label>
                    </div>
                </div>
                <div class="span">
                    <span id="spn_confirmacao_senha"></span>
                </div>
            </div>
        </div>
        <button class="botao" onclick="cadastrar()">Entrar</button>
        <div class="link">
            <span>Ja tem conta? <a href="login.html">Clique aqui!</a></span>
        </div>
    </div> 

</body>

</html>
<script src="/src/controllers/cadastro.js"></script>
